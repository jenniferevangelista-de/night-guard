# Render Blueprint: public demo of Night Guard.
# The real app runs locally with Gemma; this demo uses the Tinker fine-tuned Qwen3-8B
# and is meant for fictional examples only.
services:
  - type: web
    name: night-guard-demo
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip==26.2.2 && python -m pip install -r requirements-cloud.txt
    startCommand: uvicorn guard.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    buildFilter:        # docs, videos, training logs and tests do not need a new deploy
      ignoredPaths:
        - docs/**
        - video/**
        - train/**
        - tests/**
        - README.md
    envVars:
      - key: NG_BACKEND
        value: tinker
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FORWARDED_ALLOW_IPS
        value: "*"    # uvicorn takes the visitor address from Render's proxy header, so the per-client demo limit is per visitor
      - key: TINKER_API_KEY
        sync: false   # set by the owner in the Render dashboard, never in the repo
