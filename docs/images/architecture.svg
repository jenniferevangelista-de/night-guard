<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1040" viewBox="0 0 1720 1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4270"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#3b4270;stroke-width:2;rx:14}
      .core{fill:#eef1ff;stroke:#26326c;stroke-width:2.5}
      .t{font-size:21px;font-weight:700;fill:#1d2240}
      .s{font-size:16px;fill:#4a4f6a}
      .h{font-size:15px;font-weight:700;fill:#26326c;letter-spacing:1px}
      .ln{stroke:#3b4270;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .dl{stroke:#9aa0c0;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1720" height="1040" fill="#f7f4ec"/>
  <text x="40" y="58" font-size="34" font-weight="800" fill="#26326c">Night Guard architecture</text>
  <text x="40" y="88" class="s">Local mode: chats stay on the family's computer. External flows are shown on the right.</text>

  <!-- local area -->
  <rect x="30" y="112" width="1200" height="660" rx="22" fill="#fbfaf6" stroke="#26326c" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="54" y="146" class="h">THE FAMILY'S COMPUTER (LOCAL)</text>

  <!-- inputs -->
  <text x="54" y="186" class="h">WHERE CHATS COME FROM</text>
  <rect class="box" x="50" y="200" width="350" height="96" rx="14"/>
  <text x="66" y="234" class="t">Screen guard</text>
  <text x="66" y="260" class="s">Roblox, Discord, Minecraft, WhatsApp…</text>
  <text x="66" y="282" class="s">Gemma 4 vision reads the screen in memory</text>
  <rect class="box" x="50" y="312" width="350" height="80" rx="14"/>
  <text x="66" y="346" class="t">Browser extension</text>
  <text x="66" y="372" class="s">Discord web, WhatsApp Web (experimental)</text>
  <rect class="box" x="50" y="408" width="350" height="80" rx="14"/>
  <text x="66" y="442" class="t">Live game page / paste</text>
  <text x="66" y="468" class="s">fictional demo chat or a pasted chat</text>

  <!-- core -->
  <rect class="core" x="430" y="200" width="400" height="410" rx="18"/>
  <text x="450" y="236" class="t">Night Guard server (FastAPI)</text>
  <rect class="box" x="447" y="256" width="366" height="96" rx="12"/>
  <text x="463" y="288" class="t" font-size="19">Gemma 4 E4B (Ollama)</text>
  <text x="463" y="312" class="s">finds 14 documented pressure tactics,</text>
  <text x="463" y="333" class="s">answers in a strict JSON schema</text>
  <rect class="box" x="447" y="366" width="366" height="96" rx="12"/>
  <text x="463" y="398" class="t" font-size="19">Evidence checks</text>
  <text x="463" y="422" class="s">the quote must exist in the contact's message;</text>
  <text x="463" y="443" class="s">unreadable answer = "not an all-clear"</text>
  <rect class="box" x="447" y="476" width="366" height="116" rx="12"/>
  <text x="463" y="508" class="t" font-size="19">Severity + family rules</text>
  <text x="463" y="532" class="s">"tell family" or "child decides" per tactic;</text>
  <text x="463" y="553" class="s">Guard on/off, "Guard paused" if the model</text>
  <text x="463" y="574" class="s">is down</text>

  <!-- outputs -->
  <text x="870" y="186" class="h">WHO SEES WHAT</text>
  <rect class="box" x="860" y="200" width="340" height="150" rx="14"/>
  <text x="876" y="234" class="t">The kid</text>
  <text x="876" y="262" class="s">"DANGER" warning in plain words</text>
  <text x="876" y="284" class="s">spoken voice (pre-recorded ElevenLabs)</text>
  <text x="876" y="306" class="s">practice, medals, Night Hero rank</text>
  <text x="876" y="328" class="s">"Tell someone": editable template</text>
  <rect class="box" x="860" y="372" width="340" height="174" rx="14"/>
  <text x="876" y="406" class="t">Parents (optional Auth0)</text>
  <text x="876" y="434" class="s">risk, app, flagged phrase only</text>
  <text x="876" y="456" class="s">why it matters + what to do now</text>
  <text x="876" y="478" class="s">family rules, guard on/off</text>
  <text x="876" y="500" class="s">same name in two apps (a hint)</text>
  <text x="876" y="522" class="s">No login gate unless configured</text>

  <path class="ln" d="M400 248 L428 290"/>
  <path class="ln" d="M400 352 L428 352"/>
  <path class="ln" d="M400 448 L428 410"/>
  <path class="ln" d="M630 352 L630 364"/>
  <path class="ln" d="M630 462 L630 474"/>
  <path class="ln" d="M830 300 L858 275"/>
  <path class="ln" d="M830 520 L858 447"/>

  <text x="54" y="660" class="s">Models stay local: the chat is never sent to a server by the local app.</text>
  <text x="54" y="684" class="s">The online demo uses Tinker in the cloud instead; the app does not persist chats.</text>

  <!-- external -->
  <text x="1260" y="146" class="h">LEAVES THE COMPUTER, ONLY THIS</text>
  <rect class="box" x="1255" y="160" width="440" height="110" rx="14"/>
  <text x="1271" y="194" class="t">Phone alert (ntfy)</text>
  <text x="1271" y="222" class="s">risk level, app and kind of risk. Never the chat.</text>
  <text x="1271" y="244" class="s">Private topic, hidden in the Parents view.</text>
  <rect class="box" x="1255" y="290" width="440" height="160" rx="14"/>
  <text x="1271" y="324" class="t">Link inspector (optional, on request)</text>
  <text x="1271" y="352" class="s">Browserbase: opens the URL in an isolated cloud</text>
  <text x="1271" y="374" class="s">browser (destination, password field, screenshot)</text>
  <text x="1271" y="400" class="s">SerpApi: searches scam reports for the domain</text>
  <text x="1271" y="426" class="s">Sends only the URL / domain, never the chat</text>
  <rect class="box" x="1255" y="470" width="440" height="110" rx="14"/>
  <text x="1271" y="504" class="t">Sentry agent tracing (when on)</text>
  <text x="1271" y="532" class="s">model call timings and labels; allowlist scrubber</text>
  <text x="1271" y="554" class="s">drops anything that could hold chat text</text>
  <rect class="box" x="1255" y="600" width="440" height="120" rx="14"/>
  <text x="1271" y="634" class="t">Auth0 (optional local login)</text>
  <text x="1271" y="662" class="s">Sign-in redirects and identity data, not chat.</text>
  <text x="1271" y="686" class="s">Disabled until configured. Not used in demo.</text>

  <path class="dl" d="M1200 420 C1228 420 1226 215 1253 215"/>
  <path class="dl" d="M1200 300 C1228 300 1226 370 1253 370"/>
  <path class="dl" d="M830 590 C1000 700 1180 700 1253 540"/>
  <path class="dl" d="M1200 510 C1228 510 1226 660 1253 660"/>

  <!-- build and evaluation -->
  <rect x="30" y="800" width="1660" height="210" rx="22" fill="#eef1ff" stroke="#26326c" stroke-width="2"/>
  <text x="54" y="836" class="h">BUILT, TESTED AND HOSTED WITH</text>
  <rect class="box" x="50" y="852" width="390" height="136" rx="14"/>
  <text x="66" y="886" class="t">Tinker</text>
  <text x="66" y="914" class="s">LoRA fine-tune of Qwen3-8B on 1,000</text>
  <text x="66" y="936" class="s">fictional chats: 70/70 answers in the</text>
  <text x="66" y="958" class="s">app's schema (base model: 11/70)</text>
  <rect class="box" x="460" y="852" width="370" height="136" rx="14"/>
  <text x="476" y="886" class="t">Render</text>
  <text x="476" y="914" class="s">public demo from a Blueprint,</text>
  <text x="476" y="936" class="s">runs the Tinker model; the app</text>
  <text x="476" y="958" class="s">does not persist chat text</text>
  <rect class="box" x="850" y="852" width="410" height="136" rx="14"/>
  <text x="866" y="886" class="t">Temporal</text>
  <text x="866" y="914" class="s">durable evaluation of the fictional</text>
  <text x="866" y="936" class="s">chats; survived Ollama being killed</text>
  <text x="866" y="958" class="s">mid-run, nothing lost</text>
  <rect class="box" x="1280" y="852" width="390" height="136" rx="14"/>
  <text x="1296" y="886" class="t">Backboard</text>
  <text x="1296" y="914" class="s">same 70 chats on Gemma 3 27B,</text>
  <text x="1296" y="936" class="s">Llama 3.3 70B and Mistral Small</text>
  <text x="1296" y="958" class="s">through one API key</text>
</svg>
